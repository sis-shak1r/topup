<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเติม-ถอนเงินนักเรียน</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      font-family: 'Sarabun', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex justify-center items-center p-2 md:p-4">

  <div class="w-full max-w-md bg-white min-h-[90vh] rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden relative border border-slate-100">
    
    <!-- HEADER -->
    <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-5 rounded-b-3xl shadow-lg">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-wallet text-2xl text-amber-300"></i>
          <span class="font-bold text-lg tracking-wide">School Wallet</span>
        </div>
        <div id="adminBadge" class="hidden text-xs bg-white/20 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-1 border border-white/30">
          <i class="fa-solid fa-user-shield text-emerald-300"></i>
          <span id="adminName">Admin</span>
        </div>
      </div>
      
      <p class="text-xs text-blue-100">ระบบจัดการบริการ เติม-ถอนเงินดิจิทัลโรงเรียน</p>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="p-5 flex-1 overflow-y-auto space-y-5" id="mainContent">

      <!-- STEP 1: ADMIN LOGIN -->
      <div id="loginSection" class="space-y-4 my-auto pt-6">
        <div class="text-center">
          <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner">
            <i class="fa-solid fa-lock text-3xl"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800">เข้าสู่ระบบแอดมิน</h2>
          <p class="text-xs text-slate-500">กรอกรหัสแอดมินเพื่อเริ่มทำรายการ</p>
        </div>

        <div class="space-y-3">
          <div class="relative">
            <i class="fa-solid fa-key absolute left-4 top-3.5 text-slate-400"></i>
            <input type="password" id="adminIdInput" placeholder="รหัสผู้ดูแลระบบ ( Admin ID )" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
          </div>
          <button onclick="loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white py-3.5 rounded-xl font-semibold shadow-md shadow-blue-200 transition-all">
            <i class="fa-solid fa-right-to-bracket mr-2"></i> เข้าสู่ระบบ
          </button>
        </div>
      </div>

      <!-- STEP 2: APP DASHBOARD (Hidden by default) -->
      <div id="appSection" class="hidden space-y-5">

        <!-- SELECT MODE: TOPUP / WITHDRAW -->
        <div class="grid grid-cols-2 gap-3 bg-slate-100 p-1.5 rounded-2xl">
          <button id="btnModeTopup" onclick="setTransactionType('topup')" class="py-2.5 rounded-xl font-bold text-sm transition-all bg-emerald-500 text-white shadow-md flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-plus"></i> เติมเงิน
          </button>
          <button id="btnModeWithdraw" onclick="setTransactionType('withdraw')" class="py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-minus"></i> ถอนเงิน
          </button>
        </div>

        <!-- AMOUNT SELECTION -->
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3">
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">เลือกจำนวนเงิน (บาท)</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="selectAmount(5)" class="amt-btn bg-white border border-slate-200 hover:border-blue-500 font-bold py-2.5 rounded-xl text-slate-700 hover:text-blue-600 shadow-sm active:scale-95 transition-all">5</button>
            <button onclick="selectAmount(10)" class="amt-btn bg-white border border-slate-200 hover:border-blue-500 font-bold py-2.5 rounded-xl text-slate-700 hover:text-blue-600 shadow-sm active:scale-95 transition-all">10</button>
            <button onclick="selectAmount(20)" class="amt-btn bg-white border border-slate-200 hover:border-blue-500 font-bold py-2.5 rounded-xl text-slate-700 hover:text-blue-600 shadow-sm active:scale-95 transition-all">20</button>
            <button onclick="selectAmount(50)" class="amt-btn bg-white border border-slate-200 hover:border-blue-500 font-bold py-2.5 rounded-xl text-slate-700 hover:text-blue-600 shadow-sm active:scale-95 transition-all">50</button>
            <button onclick="selectAmount(100)" class="amt-btn bg-white border border-slate-200 hover:border-blue-500 font-bold py-2.5 rounded-xl text-slate-700 hover:text-blue-600 shadow-sm active:scale-95 transition-all">100</button>
            <button onclick="enableCustomAmount()" class="amt-btn bg-amber-50 border border-amber-200 text-amber-700 font-bold py-2.5 rounded-xl shadow-sm active:scale-95 transition-all">ระบุเอง</button>
          </div>
          
          <div class="relative">
            <input type="number" id="customAmountInput" placeholder="ระบุจำนวนเงินสด" class="w-full pl-4 pr-10 py-3 bg-white border border-slate-300 rounded-xl font-bold text-slate-800 text-center text-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <span class="absolute right-4 top-3.5 text-slate-400 font-bold">฿</span>
          </div>
        </div>

        <!-- IDENTIFY STUDENT METHOD -->
        <div class="space-y-3">
          <button onclick="openQrScanner()" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-qrcode text-lg"></i> สแกน QR Code นักเรียน
          </button>

          <div class="flex items-center my-2">
            <div class="flex-1 border-t border-slate-200"></div>
            <span class="px-3 text-xs text-slate-400 font-medium">หรือ</span>
            <div class="flex-1 border-t border-slate-200"></div>
          </div>

          <div class="flex gap-2">
            <input type="text" id="manualStudentId" placeholder="กรอกรหัสนักเรียน / RFID" class="flex-1 pl-4 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
            <button onclick="searchStudentManual()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-3 rounded-xl font-semibold active:scale-95 transition-all">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
        </div>

      </div>

      <!-- STEP 3: HISTORY SECTION (Hidden by default) -->
      <div id="historySection" class="hidden space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-slate-800"><i class="fa-solid fa-clock-rotate-left mr-2 text-blue-600"></i>ประวัติรายการล่าสุด</h3>
          <button onclick="loadHistory()" class="text-xs text-blue-600 font-semibold hover:underline">รีเฟรช</button>
        </div>
        <div id="historyList" class="space-y-2 max-h-[350px] overflow-y-auto pr-1">
          <!-- Item Dynamic JS -->
        </div>
      </div>

    </div>

    <!-- BOTTOM NAVBAR -->
    <div id="bottomNav" class="hidden bg-white border-t border-slate-100 p-2 grid grid-cols-2 gap-1 rounded-t-2xl shadow-lg">
      <button onclick="switchTab('main')" id="navMain" class="py-2 text-center text-blue-600 font-semibold text-xs flex flex-col items-center gap-1">
        <i class="fa-solid fa-house text-lg"></i> หน้าหลัก
      </button>
      <button onclick="switchTab('history')" id="navHistory" class="py-2 text-center text-slate-400 font-semibold text-xs flex flex-col items-center gap-1">
        <i class="fa-solid fa-receipt text-lg"></i> ประวัติรายการ
      </button>
    </div>

  </div>

  <!-- QR SCANNER MODAL -->
  <div id="qrModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 text-center">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-800">สแกน QR Code นักเรียน</h3>
        <button onclick="closeQrScanner()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="reader" class="overflow-hidden rounded-2xl bg-black min-h-[250px]"></div>
      <p class="text-xs text-slate-400">วาง QR Code ให้อยู่ภายในกรอบเพื่อสแกน</p>
    </div>
  </div>

  <!-- JS LOGIC -->
  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz4d1l3_HNPVu1YgdEScdNwd2KdbFM_V8fe8cscb7S17BZxVdc035D039kcTCDpt_7TTg/exec";

    let currentAdmin = null;
    let currentTransactionType = 'topup'; // 'topup' or 'withdraw'
    let selectedAmount = 0;
    let html5QrcodeScanner = null;

    // Web Audio API for Sound Notifications
    const playSound = (type) => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
        osc.frequency.setValueAtTime(164.81, ctx.currentTime + 0.15); // E3
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      }
    };

    // CALL GAS API
    async function apiCall(data) {
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data)
        });
        return await response.json();
      } catch (err) {
        console.error(err);
        return { status: 'error', message: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้' };
      }
    }

    // 1. ADMIN LOGIN
    async function loginAdmin() {
      const adminId = document.getElementById('adminIdInput').value.trim();
      if (!adminId) {
        Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัสผู้ดูแลระบบ', confirmColor: '#3085d6' });
        return;
      }

      Swal.showLoading();
      const res = await apiCall({ action: 'loginAdmin', adminId: adminId });
      Swal.close();

      if (res.allowed) {
        currentAdmin = res.profile;
        document.getElementById('adminName').innerText = currentAdmin.name;
        document.getElementById('adminBadge').classList.remove('hidden');
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');
        
        playSound('success');
        Swal.fire({ icon: 'success', title: 'เข้าสู่ระบบสำเร็จ', text: `ยินดีต้อนรับ คุณ${currentAdmin.name}`, timer: 1500, showConfirmButton: false });
      } else {
        playSound('error');
        Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: res.message || 'ไม่มีสิทธิ์เข้าใช้งาน' });
      }
    }

    // MODE SELECTION
    function setTransactionType(type) {
      currentTransactionType = type;
      const btnTopup = document.getElementById('btnModeTopup');
      const btnWithdraw = document.getElementById('btnModeWithdraw');

      if (type === 'topup') {
        btnTopup.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-emerald-500 text-white shadow-md flex items-center justify-center gap-2";
        btnWithdraw.className = "py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 flex items-center justify-center gap-2";
      } else {
        btnWithdraw.className = "py-2.5 rounded-xl font-bold text-sm transition-all bg-rose-500 text-white shadow-md flex items-center justify-center gap-2";
        btnTopup.className = "py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 flex items-center justify-center gap-2";
      }
    }

    // AMOUNT SELECTION
    function selectAmount(amt) {
      selectedAmount = amt;
      document.getElementById('customAmountInput').value = amt;
    }

    function enableCustomAmount() {
      const input = document.getElementById('customAmountInput');
      input.value = '';
      input.focus();
    }

    // SEARCH & CONFIRM PROCESS
    async function searchStudentManual() {
      const id = document.getElementById('manualStudentId').value.trim();
      if (!id) {
        Swal.fire({ icon: 'warning', title: 'กรุณากรอกรหัสนักเรียน' });
        return;
      }
      processStudentTransaction(id);
    }

    async function processStudentTransaction(studentId) {
      const amount = parseFloat(document.getElementById('customAmountInput').value);
      if (!amount || amount <= 0) {
        playSound('error');
        Swal.fire({ icon: 'warning', title: 'ยอดเงินไม่ถูกต้อง', text: 'กรุณาระบุจำนวนเงินที่ต้องการทำรายการ' });
        return;
      }

      Swal.showLoading();
      const studentRes = await apiCall({ action: 'findStudent', studentId: studentId });
      Swal.close();

      if (studentRes.status !== 'success') {
        playSound('error');
        Swal.fire({ icon: 'error', title: 'ไม่พบข้อมูล', text: studentRes.message });
        return;
      }

      const st = studentRes.student;
      const typeText = currentTransactionType === 'topup' ? 'เติมเงิน' : 'ถอนเงิน';
      const typeColor = currentTransactionType === 'topup' ? 'text-emerald-600' : 'text-rose-600';

      // Pop-up ยืนยันข้อมูล
      const confirm = await Swal.fire({
        title: `ยืนยันการ${typeText}`,
        html: `
          <div class="text-left bg-slate-50 p-4 rounded-xl space-y-2 text-sm">
            <p><strong>ชื่อ-สกุล:</strong> ${st.name}</p>
            <p><strong>รหัสนักเรียน:</strong> ${st.id} (${st.level})</p>
            <p><strong>เงินสดคงเหลือ:</strong> ${st.wallet.toLocaleString()} บาท</p>
            <hr>
            <p class="text-base font-bold ${typeColor} text-center pt-1">
              ต้องการ${typeText}จำนวน <span class="text-xl">${amount.toLocaleString()}</span> บาท
            </p>
          </div>
        `,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'ยืนยันทำรายการ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: currentTransactionType === 'topup' ? '#10b981' : '#f43f5e'
      });

      if (confirm.isConfirmed) {
        Swal.showLoading();
        const txRes = await apiCall({
          action: 'processTransaction',
          studentId: st.id,
          type: currentTransactionType,
          accountType: 'wallet',
          amount: amount,
          adminName: currentAdmin.name
        });
        Swal.close();

        if (txRes.status === 'success') {
          playSound('success');
          Swal.fire({
            icon: 'success',
            title: 'ทำรายการสำเร็จ',
            html: `
              <p class="text-sm">บันทึกข้อมูลเรียบร้อยแล้ว</p>
              <div class="mt-3 p-3 bg-emerald-50 rounded-xl text-emerald-800 text-sm font-semibold">
                ยอดเงินสดคงเหลือใหม่: ${txRes.newWalletBalance.toLocaleString()} บาท
              </div>
            `,
            timer: 3000
          });
          document.getElementById('manualStudentId').value = '';
        } else {
          playSound('error');
          Swal.fire({ icon: 'error', title: 'ทำรายการไม่สำเร็จ', text: txRes.message });
        }
      }
    }

    // QR SCANNER
    function openQrScanner() {
      document.getElementById('qrModal').classList.remove('hidden');
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        (decodedText) => {
          closeQrScanner();
          processStudentTransaction(decodedText);
        },
        (errorMessage) => { /* Ignore errors */ }
      ).catch(err => {
        alert("ไม่สามารถเปิดกล้องได้: " + err);
        closeQrScanner();
      });
    }

    function closeQrScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          document.getElementById('qrModal').classList.add('hidden');
        }).catch(() => {
          document.getElementById('qrModal').classList.add('hidden');
        });
      } else {
        document.getElementById('qrModal').classList.add('hidden');
      }
    }

    // NAVIGATION & HISTORY
    function switchTab(tab) {
      if (tab === 'main') {
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('historySection').classList.add('hidden');
        document.getElementById('navMain').className = "py-2 text-center text-blue-600 font-semibold text-xs flex flex-col items-center gap-1";
        document.getElementById('navHistory').className = "py-2 text-center text-slate-400 font-semibold text-xs flex flex-col items-center gap-1";
      } else {
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('historySection').classList.remove('hidden');
        document.getElementById('navHistory').className = "py-2 text-center text-blue-600 font-semibold text-xs flex flex-col items-center gap-1";
        document.getElementById('navMain').className = "py-2 text-center text-slate-400 font-semibold text-xs flex flex-col items-center gap-1";
        loadHistory();
      }
    }

    async function loadHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = '<p class="text-center text-slate-400 text-xs py-5">กำลังโหลดข้อมูล...</p>';

      const res = await apiCall({ action: 'getHistory' });
      if (res.status === 'success' && res.history.length > 0) {
        container.innerHTML = res.history.map(item => {
          const isDeposit = item.type.includes('เข้า') || item.type.includes('เติม');
          const badgeClass = isDeposit ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700';
          const icon = isDeposit ? 'fa-arrow-down-left' : 'fa-arrow-up-right';
          const sign = isDeposit ? '+' : '-';

          return `
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-xs">
              <div class="space-y-0.5">
                <div class="font-bold text-slate-700 flex items-center gap-1.5">
                  <span class="px-2 py-0.5 rounded-md ${badgeClass} font-semibold">
                    <i class="fa-solid ${icon}"></i> ${item.type}
                  </span>
                  <span>รหัส: ${item.studentId}</span>
                </div>
                <div class="text-slate-400">${item.detail}</div>
                <div class="text-[10px] text-slate-300">${item.date}</div>
              </div>
              <div class="text-right font-bold text-sm ${isDeposit ? 'text-emerald-600' : 'text-rose-600'}">
                ${sign}${item.amount.toLocaleString()} ฿
              </div>
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = '<p class="text-center text-slate-400 text-xs py-5">ไม่พบประวัติการทำรายการ</p>';
      }
    }
  </script>
</body>
</html>
