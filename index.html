<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Wallet - ระบบจัดการเติม-ถอนเงินดิจิทัล</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
        .bg-glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Navbar / Header -->
    <div class="max-w-md mx-auto pt-6 px-4">
        <div class="bg-indigo-900 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 bg-indigo-800 rounded-full w-32 h-32 opacity-50 blur-lg"></div>
            <div class="flex justify-between items-center mb-4 relative z-10">
                <div class="flex items-center space-x-3">
                    <div class="bg-amber-400 p-3 rounded-2xl text-indigo-950 shadow-md">
                        <i class="fa-solid fa-wallet text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold leading-tight">School Wallet</h1>
                        <p class="text-xs text-indigo-200">ระบบจัดการบริการ เติม-ถอนเงินดิจิทัลโรงเรียน</p>
                    </div>
                </div>
                <div id="adminBadge" class="hidden flex items-center space-x-2 bg-indigo-800/80 border border-indigo-700/50 rounded-full py-1 px-3">
                    <i class="fa-solid fa-user-shield text-amber-400 text-xs"></i>
                    <span id="adminName" class="text-xs font-medium max-w-[100px] truncate">ผู้ดูแลระบบ</span>
                    <button onclick="logoutAdmin()" class="text-indigo-300 hover:text-white text-xs ml-1">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-md mx-auto px-4 mt-6 space-y-6">

        <!-- Login Screen (ถ้ายังไม่ได้ล็อกอิน) -->
        <div id="loginSection" class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa-solid fa-lock text-indigo-600 mr-2"></i> เข้าสู่ระบบแอดมิน
            </h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">รหัสแอดมิน / เจ้าหน้าที่</label>
                    <input type="password" id="adminIdInput" required placeholder="กรอกรหัสผู้ดูแลระบบ" 
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-indigo-500 focus:bg-white transition-all">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-2xl shadow-lg shadow-indigo-200 transition-all text-sm flex justify-center items-center">
                    <span>เข้าสู่ระบบ</span>
                </button>
            </form>
        </div>

        <!-- Dashboard / Transaction Section (จะแสดงผลเมื่อล็อกอินแล้ว) -->
        <div id="appSection" class="hidden space-y-6">

            <!-- Filter Controls -->
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-slate-700 flex items-center">
                        <i class="fa-solid fa-filter text-indigo-500 mr-2"></i> ตัวกรองรายงาน
                    </h3>
                    <button onclick="fetchHistoryData()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex items-center">
                        <i class="fa-solid fa-rotate mr-1"></i> รีเฟรช
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <select id="filterType" onchange="handleFilterChange()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 focus:outline-none focus:border-indigo-500">
                            <option value="daily">รายวัน (Daily)</option>
                            <option value="monthly">รายเดือน (Monthly)</option>
                            <option value="yearly">รายปี (Yearly)</option>
                            <option value="all">ทั้งหมด (All)</option>
                        </select>
                    </div>
                    <div>
                        <input type="date" id="filterDate" onchange="applyFilters()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- Stats Overview Summary Card -->
                <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100">
                    <div class="bg-emerald-50 rounded-2xl p-3 text-center border border-emerald-100">
                        <p class="text-[10px] font-medium text-emerald-600">ยอดเติมรวม</p>
                        <p id="statDeposit" class="text-sm font-bold text-emerald-700 mt-1">0 ฿</p>
                    </div>
                    <div class="bg-rose-50 rounded-2xl p-3 text-center border border-rose-100">
                        <p class="text-[10px] font-medium text-rose-600">ยอดถอนรวม</p>
                        <p id="statWithdraw" class="text-sm font-bold text-rose-700 mt-1">0 ฿</p>
                    </div>
                    <div class="bg-sky-50 rounded-2xl p-3 text-center border border-sky-100">
                        <p class="text-[10px] font-medium text-sky-600">สุทธิ</p>
                        <p id="statNet" class="text-sm font-bold text-sky-700 mt-1">0 ฿</p>
                    </div>
                </div>
            </div>

            <!-- Transaction History List -->
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-list-check text-indigo-500 mr-2"></i> รายการฝาก/ถอนเงิน
                    </h3>
                    <span id="txCountBadge" class="text-[11px] bg-slate-100 text-slate-600 font-medium px-2.5 py-1 rounded-full">0 รายการ</span>
                </div>

                <!-- Scrollable Items List -->
                <div id="historyListContainer" class="space-y-2 max-h-[450px] overflow-y-auto pr-1">
                    <div class="text-center py-8 text-slate-400 text-xs">
                        <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i>
                        <p>กำลังโหลดข้อมูล...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Application Script -->
    <script>
        // *** วาง Web App URL ของคุณที่นี่ ***
        const API_URL = "https://script.google.com/macros/s/AKfycbzz69-T6aX-6l773Q44s6K-3o7L2_9iXN182A/exec"; 

        let globalHistory = [];
        let currentAdmin = null;

        window.onload = function() {
            // ตั้งค่าวันที่เริ่มต้นใน Filter เป็นวันปัจจุบัน
            document.getElementById('filterDate').valueAsDate = new Date();
            
            // เช็ค Session แอดมินเดิม
            const savedAdmin = localStorage.getItem('school_admin_profile');
            if (savedAdmin) {
                currentAdmin = JSON.parse(savedAdmin);
                showAppUI();
            }
        };

        // ส่งคำขอ API
        async function apiCall(payload) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const text = await response.text();
                return JSON.parse(text);
            } catch (error) {
                console.error("API Call Error:", error);
                throw error;
            }
        }

        // ระบบ Login
        async function handleLogin(e) {
            e.preventDefault();
            const adminId = document.getElementById('adminIdInput').value.trim();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>กำลังตรวจสอบ...`;

            try {
                const res = await apiCall({ action: 'loginAdmin', adminId: adminId });
                if (res.allowed) {
                    currentAdmin = res.profile;
                    localStorage.setItem('school_admin_profile', JSON.stringify(currentAdmin));
                    showAppUI();
                } else {
                    alert(res.message || 'รหัสผ่านไม่ถูกต้อง');
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>เข้าสู่ระบบ</span>`;
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('school_admin_profile');
            location.reload();
        }

        function showAppUI() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('adminBadge').classList.remove('hidden');
            document.getElementById('adminName').innerText = currentAdmin.name || 'ผู้ดูแลระบบ';
            fetchHistoryData();
        }

        // ดึงข้อมูลประวัติจาก Backend
        async function fetchHistoryData() {
            const container = document.getElementById('historyListContainer');
            container.innerHTML = `
                <div class="text-center py-8 text-slate-400 text-xs">
                    <i class="fa-solid fa-spinner fa-spin text-lg mb-2 text-indigo-500"></i>
                    <p>กำลังโหลดประวัติการทำรายการทุกแถว...</p>
                </div>`;

            try {
                const res = await apiCall({ action: 'getHistory' });
                if (res.status === 'success') {
                    globalHistory = res.history || [];
                    applyFilters();
                } else {
                    container.innerHTML = `<div class="text-center py-6 text-rose-500 text-xs">${res.message}</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="text-center py-6 text-rose-500 text-xs">ไม่สามารถโหลดข้อมูลได้</div>`;
            }
        }

        function handleFilterChange() {
            const filterType = document.getElementById('filterType').value;
            const dateInput = document.getElementById('filterDate');
            dateInput.disabled = (filterType === 'all');
            applyFilters();
        }

        // ตัวกรองรายการประวัติ (Filter)
        function applyFilters() {
            const filterType = document.getElementById('filterType').value;
            const selectedDateVal = document.getElementById('filterDate').value;
            const selectedDate = selectedDateVal ? new Date(selectedDateVal) : new Date();

            let filtered = globalHistory.filter(item => {
                const itemDate = new Date(item.timestamp);
                
                if (filterType === 'daily') {
                    return itemDate.getFullYear() === selectedDate.getFullYear() &&
                           itemDate.getMonth() === selectedDate.getMonth() &&
                           itemDate.getDate() === selectedDate.getDate();
                } else if (filterType === 'monthly') {
                    return itemDate.getFullYear() === selectedDate.getFullYear() &&
                           itemDate.getMonth() === selectedDate.getMonth();
                } else if (filterType === 'yearly') {
                    return itemDate.getFullYear() === selectedDate.getFullYear();
                }
                return true; // 'all'
            });

            renderHistoryList(filtered);
            calculateStats(filtered);
        }

        // แปลงเวลา timestamp เป็นรูปแบบวันไทย
        function formatThaiDateTime(timeMs) {
            const d = new Date(timeMs);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const mins = String(d.getMinutes()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${mins}`;
        }

        // แสดงผลรายการ
        function renderHistoryList(items) {
            const container = document.getElementById('historyListContainer');
            document.getElementById('txCountBadge').innerText = `${items.length} รายการ`;

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">ไม่พบประวัติรายการตามเงื่อนไขที่เลือก</div>`;
                return;
            }

            let html = '';
            items.forEach(item => {
                const isDeposit = item.type.includes('เข้า') || item.detail.includes('ฝาก');
                const badgeColor = isDeposit ? 'text-emerald-600 bg-emerald-50' : 'text-rose-600 bg-rose-50';
                const sign = isDeposit ? '+' : '-';
                const amountFormatted = item.amount.toLocaleString('th-TH');

                html += `
                    <div class="flex items-center justify-between p-3.5 bg-slate-50/80 rounded-2xl border border-slate-100 hover:bg-white transition-all">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full ${badgeColor} flex items-center justify-center font-bold text-sm">
                                <i class="fa-solid ${isDeposit ? 'fa-arrow-down-left' : 'fa-arrow-up-right'}"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-slate-800">รหัสนักเรียน: ${item.studentId}</p>
                                <p class="text-[10px] text-slate-400 mt-0.5">${formatThaiDateTime(item.timestamp)}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-bold ${isDeposit ? 'text-emerald-600' : 'text-rose-600'}">${sign}${amountFormatted} ฿</p>
                            <p class="text-[10px] text-slate-400 mt-0.5 max-w-[120px] truncate">${item.detail}</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // คำนวณยอดรวมแสดงผล
        function calculateStats(items) {
            let totalDeposit = 0;
            let totalWithdraw = 0;

            items.forEach(item => {
                const isDeposit = item.type.includes('เข้า') || item.detail.includes('ฝาก');
                if (isDeposit) {
                    totalDeposit += item.amount;
                } else {
                    totalWithdraw += item.amount;
                }
            });

            const net = totalDeposit - totalWithdraw;

            document.getElementById('statDeposit').innerText = `${totalDeposit.toLocaleString('th-TH')} ฿`;
            document.getElementById('statWithdraw').innerText = `${totalWithdraw.toLocaleString('th-TH')} ฿`;
            document.getElementById('statNet').innerText = `${net.toLocaleString('th-TH')} ฿`;
        }
    </script>
</body>
</html>
